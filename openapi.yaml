openapi: 3.1.0

info:
  title: Larasell Reviews API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Product reviews for a Larasell store, following [JSON:API 1.1](https://jsonapi.org/format/1.1/).

    **Media type.** Send request documents with `Content-Type: application/vnd.api+json`. A different
    media type, or a JSON:API media type with any parameter but `profile`, is answered with 415. When
    every JSON:API media type in `Accept` has a parameter other than `profile`, the answer is 406.
    The API supports no JSON:API extensions.

    **Errors.** Every error is a JSON:API error document. Errors about the request document point at
    the member at fault (`source.pointer`), errors about a header name it (`source.header`).

    **Authentication.** Every request needs an API token, which an admin creates in the admin panel
    under Settings > API tokens. Send it as `Authorization: Bearer <token>`. A request without a
    valid token is answered with 401, before anything else, so it can't tell which reviews exist.

servers:
  - url: "{origin}"
    variables:
      origin:
        default: http://localhost:8000
        description: The origin of the app that installs the package.

security:
  - apiToken: []

tags:
  - name: Product reviews
    description: Reviews of a store's products, with a 1–5 star rating and an optional comment.

paths:
  /api/product-reviews:
    get:
      operationId: listProductReviews
      summary: List reviews
      description: Reviews in pages, newest first.
      tags: [Product reviews]
      parameters:
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/ReviewFields"
        - $ref: "#/components/parameters/ProductFields"
        - $ref: "#/components/parameters/CustomerFields"
      responses:
        "200":
          description: A page of reviews.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProductReviewCollectionDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

    post:
      operationId: createProductReview
      summary: Submit a review
      description: |
        The review starts as `pending`. When a customer is linked and no `name` is given, the
        customer's full name is copied onto the review, so it stays when the customer is deleted.

        Each client can submit `larasell.reviews.api.submissions_per_minute` reviews per minute
        (10 by default), counted per IP address.
      tags: [Product reviews]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CreateProductReviewDocument"
            example:
              data:
                type: product-reviews
                attributes:
                  rating: 5
                  name: Alex
                  comment: Would buy again.
                relationships:
                  product:
                    data: { type: products, id: "1" }
      responses:
        "201":
          description: The review was submitted.
          headers:
            Location:
              description: The new review's URL.
              schema: { type: string, format: uri }
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProductReviewDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/product-reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The review's id.
        schema: { type: string, pattern: "^[0-9]+$" }

    get:
      operationId: showProductReview
      summary: Show a review
      tags: [Product reviews]
      parameters:
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/ReviewFields"
        - $ref: "#/components/parameters/ProductFields"
        - $ref: "#/components/parameters/CustomerFields"
      responses:
        "200":
          description: The review.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProductReviewDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

    patch:
      operationId: updateProductReview
      summary: Update a review
      description: |
        Attributes left out stay as they are. Setting `status` approves or rejects the review; a
        review never goes back to `pending`. A review's product and customer can't be changed.
      tags: [Product reviews]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UpdateProductReviewDocument"
            example:
              data:
                type: product-reviews
                id: "1"
                attributes:
                  rating: 4
                  status: approved
      responses:
        "200":
          description: The updated review.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProductReviewDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

    delete:
      operationId: deleteProductReview
      summary: Delete a review
      tags: [Product reviews]
      responses:
        "204":
          description: The review was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: An API token from the admin panel's Settings > API tokens.

  parameters:
    PageNumber:
      name: page[number]
      in: query
      description: The page to return.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page[size]
      in: query
      description: Reviews per page. Larger values are capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Include:
      name: include
      in: query
      description: |
        Related resources to add to `included`, separated by commas: `product`, `customer` or both.
        Any other path is answered with 400.
      schema: { type: string, examples: ["product,customer"] }
    ReviewFields:
      name: fields[product-reviews]
      in: query
      description: Only these review attributes, separated by commas.
      schema: { type: string, examples: ["rating,status"] }
    ProductFields:
      name: fields[products]
      in: query
      description: Only these attributes of included products, separated by commas.
      schema: { type: string, examples: [name] }
    CustomerFields:
      name: fields[customers]
      in: query
      description: Only these attributes of included customers, separated by commas.
      schema: { type: string, examples: [first_name] }

  responses:
    BadRequest:
      description: |
        The request document isn't a JSON object, e.g. because it isn't valid JSON, or `include`
        names a path other than `product` and `customer` (`source.parameter` is `include`).
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
          example:
            jsonapi: { version: "1.1" }
            errors:
              - status: "400"
                title: Bad Request
                detail: The request document must be a JSON object.
    Forbidden:
      description: |
        The request asks for something the API doesn't do: a client-generated id on create
        (`/data/id`), or a new product or customer on update (`/data/relationships`).
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    NotFound:
      description: No review has this id.
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    NotAcceptable:
      description: Every JSON:API media type in `Accept` has a parameter other than `profile`.
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    Conflict:
      description: The document's `type`, or on update its `id`, doesn't match the endpoint.
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    UnsupportedMediaType:
      description: |
        The request document wasn't sent as `application/vnd.api+json`, or its media type has a
        parameter other than `profile`.
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    UnprocessableContent:
      description: The document is invalid. There is one error per invalid member, each with a `source.pointer`.
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
          example:
            jsonapi: { version: "1.1" }
            errors:
              - status: "422"
                title: Unprocessable Content
                detail: The rating field must be between 1 and 5.
                source: { pointer: /data/attributes/rating }
    Unauthorized:
      description: |
        The request has no API token, or one that is unknown or expired. After 30 such requests in a
        minute, one address gets 429 until the minute is over.
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
          example:
            jsonapi: { version: "1.1" }
            errors:
              - status: "401"
                title: Unauthorized
    TooManyRequests:
      description: The API token submitted too many reviews in the last minute.
      headers:
        Retry-After:
          description: Seconds until the client can submit again.
          schema: { type: integer }
      content:
        application/vnd.api+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }

  schemas:
    JsonApi:
      type: object
      required: [version]
      properties:
        version: { const: "1.1" }

    ReviewRating:
      type: integer
      minimum: 1
      maximum: 5
      description: Stars, from 1 to 5.

    ProductReviewStatus:
      type: string
      enum: [pending, approved, rejected]

    ProductIdentifier:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: products }
        id: { type: string }

    CustomerIdentifier:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: customers }
        id: { type: string }

    ProductReview:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type: { const: product-reviews }
        id: { type: string }
        attributes:
          type: object
          description: All of them unless `fields[product-reviews]` names fewer.
          properties:
            name:
              type: string
              description: The reviewer's name. Kept when a linked customer is deleted.
            rating: { $ref: "#/components/schemas/ReviewRating" }
            comment: { type: [string, "null"] }
            status: { $ref: "#/components/schemas/ProductReviewStatus" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        relationships:
          type: object
          description: Always present, whether or not they are included.
          required: [product, customer]
          properties:
            product:
              type: object
              required: [data]
              properties:
                data: { $ref: "#/components/schemas/ProductIdentifier" }
            customer:
              type: object
              required: [data]
              properties:
                data:
                  description: Null for a guest's review.
                  oneOf:
                    - $ref: "#/components/schemas/CustomerIdentifier"
                    - type: "null"
        links:
          type: object
          required: [self]
          properties:
            self: { type: string, format: uri }

    Product:
      type: object
      required: [type, id, attributes]
      properties:
        type: { const: products }
        id: { type: string }
        attributes:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }

    Customer:
      type: object
      required: [type, id, attributes]
      properties:
        type: { const: customers }
        id: { type: string }
        attributes:
          type: object
          properties:
            first_name: { type: string }
            last_name: { type: string }

    Included:
      type: array
      description: The resources `include` asked for, each once.
      items:
        oneOf:
          - $ref: "#/components/schemas/Product"
          - $ref: "#/components/schemas/Customer"

    ProductReviewDocument:
      type: object
      required: [jsonapi, data, links]
      properties:
        jsonapi: { $ref: "#/components/schemas/JsonApi" }
        data: { $ref: "#/components/schemas/ProductReview" }
        included: { $ref: "#/components/schemas/Included" }
        links:
          type: object
          required: [self]
          properties:
            self: { type: string, format: uri }

    ProductReviewCollectionDocument:
      type: object
      required: [jsonapi, data, links, meta]
      properties:
        jsonapi: { $ref: "#/components/schemas/JsonApi" }
        data:
          type: array
          items: { $ref: "#/components/schemas/ProductReview" }
        included: { $ref: "#/components/schemas/Included" }
        links:
          type: object
          description: Pagination links; `prev` and `next` are null on the first and last page.
          required: [first, last, prev, next]
          properties:
            first: { type: string, format: uri }
            last: { type: string, format: uri }
            prev: { type: [string, "null"], format: uri }
            next: { type: [string, "null"], format: uri }
        meta:
          type: object
          description: Laravel's pagination information.
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            from: { type: [integer, "null"] }
            to: { type: [integer, "null"] }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            path: { type: string, format: uri }
            links:
              type: array
              description: A link per page, as Laravel's paginator renders them.
              items:
                type: object
                properties:
                  url: { type: [string, "null"] }
                  label: { type: string }
                  page: { type: [integer, "null"] }
                  active: { type: boolean }

    CreateProductReviewDocument:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type: { const: product-reviews }
            attributes:
              type: object
              required: [rating]
              properties:
                rating: { $ref: "#/components/schemas/ReviewRating" }
                name:
                  type: [string, "null"]
                  maxLength: 255
                  description: Required unless a customer is linked; their name is used then.
                comment: { type: [string, "null"], maxLength: 5000 }
            relationships:
              type: object
              required: [product]
              properties:
                product:
                  type: object
                  required: [data]
                  properties:
                    data: { $ref: "#/components/schemas/ProductIdentifier" }
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      oneOf:
                        - $ref: "#/components/schemas/CustomerIdentifier"
                        - type: "null"

    UpdateProductReviewDocument:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { const: product-reviews }
            id:
              type: string
              description: Must match the id in the URL.
            attributes:
              type: object
              properties:
                rating: { $ref: "#/components/schemas/ReviewRating" }
                name: { type: string, minLength: 1, maxLength: 255 }
                comment: { type: [string, "null"], maxLength: 5000 }
                status:
                  type: string
                  enum: [approved, rejected]

    Error:
      type: object
      required: [status, title]
      properties:
        status:
          type: string
          description: The HTTP status code, as a string.
        title:
          type: string
          description: The status code's standard reason phrase.
        detail: { type: string }
        source:
          type: object
          properties:
            pointer:
              type: string
              description: A JSON Pointer to the member of the request document at fault.
            header:
              type: string
              description: The request header at fault.

    ErrorDocument:
      type: object
      required: [jsonapi, errors]
      properties:
        jsonapi: { $ref: "#/components/schemas/JsonApi" }
        errors:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Error" }
